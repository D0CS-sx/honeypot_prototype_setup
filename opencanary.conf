{
  "device.node_id": "canary-demo-1",
  "ip.ignorelist": [],
  "ftp.enabled": true,
  "ftp.port": 2121,
  "ftp.banner": "FTP server ready",
  "http.enabled": true,
  "http.port": 8080,
  "http.skin": "nasLogin",
  "mysql.enabled": true,
  "mysql.port": 3306,
  "mysql.banner": "5.5.43-0ubuntu0.14.04.1",
  "portscan.enabled": false,
  "ssh.enabled": false,
  "telnet.enabled": false,
  "logger": {
    "class": "PyLogger",
    "kwargs": {
      "formatters": {
        "plain": {
          "format": "%(message)s"
        }
      },
      "handlers": {
        "file": {
          "class": "logging.FileHandler",
          "filename": "/var/log/opencanary/opencanary.log"
        }
      }
    }
  }
}
